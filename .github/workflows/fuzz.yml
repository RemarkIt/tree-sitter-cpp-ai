name: Fuzz Parser

on:
  push:
    branches: [main]
    paths:
      - src/scanner.c
      - src/scanner/**
  pull_request:
    paths:
      - src/scanner.c
      - src/scanner/**

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@v4

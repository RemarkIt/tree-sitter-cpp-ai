name: CI

on:
  push:
    branches: [main]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    # The Windows image's node-gyp cannot detect Visual Studio (upstream CI fails the same way).
    continue-on-error: ${{matrix.os == 'windows-latest'}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Checkout tree-sitter-c
        uses: actions/checkout@v5
        with:
          repository: tree-sitter/tree-sitter-c
          path: node_modules/tree-sitter-c
          sparse-checkout: queries/
          ref: v0.24.1
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.26.5
      - name: Verify generated sources
        if: runner.os == 'Linux'
        run: |
          tree-sitter generate
          git diff --exit-code -- src/
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          # test-node: true
          test-python: true
          test-go: true
          # The Ubuntu Swift toolchain lacks libxml2.so.2; Swift bindings are unchanged from upstream.
          test-swift: false
      - name: Parse examples
        uses: tree-sitter/parse-action@v4
        with:
          files: examples/*
